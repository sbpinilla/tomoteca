name: CI

# Compilar tarda unos diez minutos, así que los cambios que no pueden romper el
# build —documentación, licencia, el propio README— no disparan nada.
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - LICENSE
      - .gitignore
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - LICENSE
      - .gitignore
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Ejecutar también los UI tests (varios minutos)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compilar y testear
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      # El proyecto necesita Xcode 26 o superior: los símbolos generados del String
      # Catalog (STRING_CATALOG_GENERATE_SYMBOLS) no existen antes, y sin ellos no
      # compila una sola vista. Se elige el Xcode más nuevo de la imagen y se
      # comprueba la versión, para que un cambio de runner falle diciendo por qué.
      - name: Seleccionar Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Se necesita Xcode 26 o superior (hay $MAJOR). Sin él no se generan los símbolos del String Catalog."
            exit 1
          fi

      # El nombre del simulador cambia con cada versión de Xcode, así que en vez de
      # fijar "iPhone 17" cogemos el primer iPhone disponible en el runner.
      - name: Elegir simulador
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          NAME=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].name')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No hay ningún simulador de iPhone disponible en el runner." >&2
            exit 1
          fi
          echo "Usando $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Arrancarlo aquí evita que el primer xcodebuild pague el arranque en frío.
      - name: Arrancar el simulador
        run: xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true

      # Se compila una vez y luego se ejecutan los tests sin recompilar.
      - name: Compilar para testear
        run: |
          xcodebuild build-for-testing \
            -scheme tomoteca \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Tests unitarios
        run: |
          xcodebuild test-without-building \
            -scheme tomoteca \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:tomotecaTests \
            CODE_SIGNING_ALLOWED=NO

      # Solo bajo petición: cada UI test arranca la app desde cero y la suite tarda minutos.
      - name: UI tests
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: |
          xcodebuild test-without-building \
            -scheme tomoteca \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:tomotecaUITests \
            CODE_SIGNING_ALLOWED=NO
